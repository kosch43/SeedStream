# SeedStream only — connect to your EXISTING Prowlarr + qBittorrent + SABnzbd.
# Supports torrents AND/OR Usenet NZBs.
#
# Mount whichever download paths apply to your setup:
#   - QBIT_SAVE_PATH for torrent downloads (set in .env)
#   - SABNZBD_COMPLETE_PATH for NZB completed downloads (set in .env)
# Each must be an absolute path and mounted at the same path inside the container.
services:
  seedstream:
    build: .
    container_name: seedstream
    restart: unless-stopped
    env_file: .env
    ports:
      - "7700:7700"
    volumes:
      # Torrent downloads — comment out if running NZB-only.
      - "${QBIT_SAVE_PATH:-/tmp/qbit-placeholder}:${QBIT_SAVE_PATH:-/tmp/qbit-placeholder}:ro"
      # NZB completed downloads — comment out if running torrent-only.
      - "${SABNZBD_COMPLETE_PATH:-/tmp/nzb-placeholder}:${SABNZBD_COMPLETE_PATH:-/tmp/nzb-placeholder}:ro"
