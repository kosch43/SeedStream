# NOTE: only needed if you set FILE_SERVER_BASE_URL (external file server).
# On a single VPS, leave that blank and SeedStream serves files itself — skip this.

# Example nginx config for the file server that SeedStream redirects to.
# This must run ON your seedbox (or have the seedbox storage mounted) so it
# can serve the qBittorrent save path. Range requests (seeking) work out of
# the box with simple static file serving.

server {
    listen 443 ssl http2;
    server_name files.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/files.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.yourdomain.com/privkey.pem;

    # Map the public /seedstream/ path to the qBit save path.
    # Must equal QBIT_SAVE_PATH in your .env.
    location /seedstream/ {
        alias /home/youruser/downloads/seedstream/;

        # Range / seeking support
        add_header Accept-Ranges bytes;
        # Don't buffer big files in memory
        sendfile on;
        tcp_nopush on;
        aio threads;

        # CORS so players in browsers can fetch
        add_header Access-Control-Allow-Origin *;

        # Optional: protect with the same key your addon uses, via a referer
        # or auth_request. Keeping it simple here.
        autoindex off;
    }
}

# On Ultra.cc specifically, you usually already have an nginx/Apache "personal
# web server" pointed at a public_html or downloads dir. You can instead point
# FILE_SERVER_BASE_URL at that existing HTTP file listing, as long as it:
#   1) serves your QBIT_SAVE_PATH, and
#   2) supports HTTP range requests (Ultra.cc's does).
