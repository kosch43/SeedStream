# Turnkey full stack: Prowlarr + qBittorrent + SABnzbd + SeedStream.
# Supports torrents AND Usenet NZBs out of the box.
#
# Bring it up, add your trackers/indexers in Prowlarr, set credentials in .env,
# set PROWLARR_INDEXER_IDS and NZB_INDEXER_IDS in .env, then restart seedstream.
services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: seedstream-prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./data/prowlarr:/config
    ports:
      - "9696:9696"
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: seedstream-qbit
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - WEBUI_PORT=8080
    volumes:
      - ./data/qbittorrent:/config
      - ./downloads/torrents:/downloads/torrents
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: seedstream-sabnzbd
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./data/sabnzbd:/config
      - ./downloads/usenet:/downloads/usenet
    ports:
      - "8090:8080"
    restart: unless-stopped

  seedstream:
    build: .
    container_name: seedstream
    env_file: .env
    volumes:
      # Torrent downloads (read-only: serve files, never modify)
      - ./downloads/torrents:/downloads/torrents:ro
      # NZB completed downloads (read-only)
      - ./downloads/usenet/complete:/downloads/sabnzbd/complete:ro
    ports:
      - "7700:7700"
    depends_on:
      - prowlarr
      - qbittorrent
      - sabnzbd
    restart: unless-stopped
